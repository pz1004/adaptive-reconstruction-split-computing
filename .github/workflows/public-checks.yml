name: Public checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: public-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out the public repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            release/v1.3.0/requirements.txt

      - name: Install pinned dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: >-
          python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          --extra-index-url https://pypi.org/simple
          -r requirements.txt
          -r release/v1.3.0/requirements.txt

      - name: Run the public disclosure and test gate
        run: ./run_public_checks.sh
